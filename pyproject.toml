[project]
name = "meritz-openapi-studio"
version = "0.2.0"
description = "메리츠증권 Open API — 명령줄 도구와 에이전트 스킬"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
realtime = ["websocket-client>=1.7.0"]

[project.scripts]
meritz = "meritz_studio.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meritz_studio"]

# 스킬을 패키지에 동봉해 `meritz skills install` 로 바로 깔 수 있게 한다.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "meritz_studio/skills"

[tool.pytest.ini_options]
markers = ["slow: 가상환경을 만들어 설치까지 하는 테스트 (네트워크가 필요하다)"]
# 기본 실행은 네트워크 없이 돌아야 한다. 설치 검증은 CI 에서 -m slow 로 켠다.
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # 줄 길이는 line-length 로 본다
