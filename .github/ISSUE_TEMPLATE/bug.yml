name: meritz 명령이 동작하지 않습니다
description: CLI 나 스킬을 쓰시다 생긴 문제를 알려 주십시오.
labels:
- bug
body:
- type: markdown
  attributes:
    value: |
      ## 붙여넣기 전에 한 번만 확인해 주십시오

      **앱키(App Key)·시크릿(App Secret)·접근토큰·계좌번호를 이 화면에 넣지 마십시오.**
      터미널 기록에는 `export MERITZ_APP_KEY=...` 가 그대로 남아 있습니다.
      명령과 출력을 옮기실 때 특히 주의해 주십시오.
      이슈는 누구나 볼 수 있고, 지우셔도 수정 이력에 남습니다.

      - 앱키·시크릿·접근토큰 → `***`
      - 계좌번호 → `***`
      - 조회 결과에 담긴 잔고·보유종목·주문번호 → 지우시거나 임의의 값으로 바꿔 주십시오

      이미 노출하셨다면 개발자 포털에서 **즉시 재발급**해 주십시오.

      ---

      주문이 나가지 않았다거나 잔고가 다르게 보이는 등 **계좌·거래에 관한 문의는
      이곳에서 처리해 드릴 수 없습니다.** 개발자 포털의 문의 채널을 이용해 주십시오.
- type: textarea
  id: what-happened
  attributes:
    label: 무슨 일이 있었습니까
    description: 기대하신 동작과 실제로 벌어진 일을 함께 적어 주십시오.
    placeholder: |
      meritz api list -q 잔고 로 찾은 API 를 meritz call 로 부르면 사용법 오류가 납니다.
  validations:
    required: true
- type: input
  id: command
  attributes:
    label: 실행하신 명령
    description: 실제로 치신 명령을 한 줄로 적어 주십시오. **앱키와 계좌번호는 지우고** 넣어 주십시오.
    placeholder: meritz call deposit --json
  validations:
    required: true
- type: dropdown
  id: exit-code
  attributes:
    label: 종료 코드
    description: '`echo $?` 로 확인하실 수 있습니다.'
    options:
    - 0 — 성공
    - 2 — 사용법 오류
    - 3 — 실패
    - 4 — 확인 필요
    - 5 — 주문 미접수
    - 명령이 끝나지 않거나 멈췄습니다
    - 확인하지 못했습니다
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: 재현 방법
    description: |
      저희가 그대로 따라 할 수 있도록 순서대로 적어 주십시오. 화면에 나온 출력도 함께 넣어 주시면 좋습니다.

      예를 들면 이런 식입니다 — uv tool install 로 설치 → 앱키를 환경변수로 지정 → meritz doctor — 모두 통과 → meritz call deposit — 아래 오류
    render: shell
  validations:
    required: true
- type: dropdown
  id: server
  attributes:
    label: 어느 서버였습니까
    description: '`MERITZ_BASE_URL` 을 지정하지 않으셨다면 운영 서버입니다.'
    options:
    - 운영 서버 (기본값)
    - 다른 서버 (MERITZ_BASE_URL·MERITZ_WS_URL 을 함께 지정)
    - 잘 모르겠습니다
  validations:
    required: true
- type: input
  id: api-type
  attributes:
    label: 호출한 API 또는 API 경로
    description: '`meritz call`·`meritz order`·`meritz ws` 에 넘기신 이름을 적어 주십시오. 아시면 API 경로도 함께 적어 주시면 좋습니다.'
    placeholder: deposit (/accounts/v1/me/deposit)
  validations:
    required: false
- type: dropdown
  id: install
  attributes:
    label: 어떻게 설치하셨습니까
    options:
    - uvx 로 그때그때 실행
    - uv tool install
    - pip install
    - 저장소를 내려받아 실행
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: meritz 버전
    description: '`meritz --version` 결과입니다. 저장소에서 실행하셨다면 커밋 해시를 적어 주셔도 됩니다.'
    placeholder: meritz 0.2.0
  validations:
    required: true
- type: input
  id: python-version
  attributes:
    label: 파이썬 버전
    description: '`python --version` 결과입니다. 3.11 이상이 필요합니다.'
    placeholder: Python 3.11.9
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: 운영체제와 셸
    placeholder: macOS 14.5 / zsh
  validations:
    required: false
- type: textarea
  id: doctor
  attributes:
    label: meritz doctor 결과
    description: '`meritz doctor` 를 돌려 보신 결과를 넣어 주시면 큰 도움이 됩니다. 자격증명과 계좌 정보는 반드시 지우고 넣어 주십시오.'
    render: shell
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다. 명령과 출력에서도 지웠습니다.
      required: true
    - label: 붙여넣은 출력에서 잔고·보유종목·주문번호 등 계좌 정보를 지웠습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 도구에 관한 문제입니다.
      required: true
