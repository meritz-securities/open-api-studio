name: 이런 기능이 있었으면 합니다
description: 명령이나 스킬에 대한 제안을 남겨 주십시오.
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: |
      제안하시기 전에 두 가지만 알려 드립니다.

      - **주문의 두 단계 확인(`--confirm`)은 없앨 수 없습니다.** 이 절차를 건너뛰거나
        토큰을 자동으로 넣어 주는 기능은 받지 않습니다.
      - **종료 코드는 스크립트가 결과를 판정하는 약속**입니다
        (`0` 성공 / `2` 사용법 오류 / `3` 실패 / `4` 확인 필요 / `5` 주문 미접수).
        이 뜻을 바꾸는 제안은 신중하게 검토합니다.

      API 자체에 새 기능이 필요하신 경우에는 이곳이 아니라 개발자 포털로 보내 주십시오.
- type: textarea
  id: problem
  attributes:
    label: 어떤 점이 아쉬우셨습니까
    description: 무엇을 하시려다 막히셨는지 적어 주십시오.
    placeholder: 여러 종목의 현재가를 한 번에 받아 스크립트에서 쓰고 싶은데, 매번 따로 부르고 있습니다.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: 어떻게 되면 좋겠습니까
    description: 원하시는 명령의 모양이 있으시면 함께 적어 주십시오.
    placeholder: meritz call ... 이런 식으로 쓸 수 있으면 좋겠습니다
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: 어느 부분입니까
    options:
    - meritz api — 목록·명세 확인
    - meritz call — 조회
    - meritz order — 주문·환전
    - meritz ws — 실시간
    - meritz doctor / token — 점검
    - meritz skills — 에이전트 스킬
    - 예제 (examples/)
    - 설치·설정
  validations:
    required: true
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 비슷한 제안이 이미 올라와 있는지 찾아보았습니다.
      required: false
    - label: 주문의 확인 절차를 건너뛰자는 제안이 아닙니다.
      required: true
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 저장소의 코드나 문서에 관한 것입니다.
      required: true
