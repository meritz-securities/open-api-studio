name: 명세·도움말이 실제와 다릅니다
description: '`meritz api show` 의 내용이나 README·스킬 문서가 실제 동작과 어긋나는 곳을 알려 주십시오.'
labels:
- documentation
body:
- type: markdown
  attributes:
    value: |
      `meritz api show` 가 알려 주는 필수 항목·코드값·응답 필드는 카탈로그에서 만들어집니다.
      그 내용이 실제 응답과 다르거나, README·스킬 문서의 설명이 실제와 어긋난다면
      알려 주십시오.

      **앱키·시크릿·접근토큰·계좌번호는 넣지 말아 주십시오.**
- type: dropdown
  id: kind
  attributes:
    label: 어떤 종류의 차이입니까
    options:
    - meritz api show 의 내용이 실제 응답과 다릅니다
    - meritz api list 로 원하는 API 가 찾아지지 않습니다
    - 명령 도움말(--help)이 실제 동작과 다릅니다
    - README 의 설명이 실제 동작과 다릅니다
    - 스킬 문서의 안내가 실제와 다릅니다
    - 오탈자·깨진 링크
  validations:
    required: true
- type: input
  id: location
  attributes:
    label: 어디입니까
    description: 명령이나 파일 경로, README 의 절 제목을 적어 주십시오.
    placeholder: meritz api show market_prices / skills/meritz-openapi-trading
  validations:
    required: true
- type: input
  id: api-type
  attributes:
    label: 관련된 API 또는 API 경로
    placeholder: market_prices (/market/v1/prices)
  validations:
    required: false
- type: textarea
  id: documented
  attributes:
    label: 문서에는 이렇게 되어 있습니다
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 실제로는 이렇습니다
    description: 확인하신 방법도 함께 적어 주시면 좋습니다. 출력을 옮기실 때 계좌 정보는 지워 주십시오.
  validations:
    required: true
- type: dropdown
  id: server
  attributes:
    label: 어느 서버에서 확인하셨습니까
    options:
    - 운영 서버 (기본값)
    - 다른 서버 (MERITZ_BASE_URL 을 지정)
    - 양쪽 모두
    - 실행하지 않고 문서만 보았습니다
  validations:
    required: true
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 저장소의 코드나 문서에 관한 것입니다.
      required: true
